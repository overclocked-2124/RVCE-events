name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      service:
        description: Service to deploy
        required: true
        default: frontend
        type: choice
        options:
          - frontend
          - all
          - identity-service
          - event-service
          - registration-service
          - attendance-service
          - notification-service
      image_tag:
        description: Immutable container image tag to deploy
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Containers
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prep.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rvce-events-frontend:${{ steps.prep.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/rvce-events-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Services
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env || 'staging' }}
    concurrency:
      group: ${{ inputs.target_env || 'staging' }}-deployment
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          python3 -c "
          import os, base64, re

          raw = os.environ.get('DEPLOY_SSH_PRIVATE_KEY', '').strip()
          key_data = ''

          # 1. Check if raw value is a base64 encoded key
          try:
              decoded = base64.b64decode(raw).decode('utf-8')
              if '-----BEGIN' in decoded:
                  key_data = decoded
          except Exception:
              pass

          # 2. Reconstruct if flattened single-line
          if not key_data and '-----BEGIN' in raw:
              cleaned = raw.replace('\r', '').strip('\'\"')
              if '\\n' in cleaned:
                  cleaned = cleaned.replace('\\n', '\n')
              m = re.search(r'(-----BEGIN [^-]+-----)(.*?)(-----END [^-]+-----)', cleaned, re.DOTALL)
              if m:
                  header = m.group(1)
                  body = m.group(2).replace(' ', '').replace('\n', '').strip()
                  footer = m.group(3)
                  folded = '\n'.join([body[i:i+64] for i in range(0, len(body), 64)])
                  key_data = f'{header}\n{folded}\n{footer}\n'

          if not key_data:
              key_data = raw if raw.endswith('\n') else raw + '\n'

          with open(os.path.expanduser('~/.ssh/id_ed25519'), 'w') as f:
              f.write(key_data)
          "
          chmod 600 ~/.ssh/id_ed25519
          echo "SSH key line count: $(wc -l < ~/.ssh/id_ed25519)"
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2>/dev/null || echo "Notice: Key format check finished."
          chmod 644 ~/.ssh/id_ed25519.pub 2>/dev/null || true
          if [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          ssh-keyscan -t ed25519,ecdsa,rsa -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rvce-events' }}
          SERVICE: ${{ inputs.service || 'frontend' }}
          IMAGE_TAG: ${{ needs.build-and-publish.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch origin main && git checkout --detach origin/main && ./scripts/deploy/deploy-service.sh '$SERVICE' '$IMAGE_TAG'"
