syntax = "proto3";

package in.rvce.events.models;

option java_multiple_files = true;
option java_package = "in.rvce.events.models";

enum UserRole {
  ROLE_UNSPECIFIED = 0;
  ROLE_STUDENT = 1;
  ROLE_ORGANIZER = 2;
  ROLE_FACULTY_ADMIN = 3;
}

enum ProfileStatus {
  PROFILE_STATUS_UNSPECIFIED = 0;
  PROFILE_STATUS_PENDING = 1;
  PROFILE_STATUS_PARTIAL = 2;
  PROFILE_STATUS_COMPLETE = 3;
  PROFILE_STATUS_SUSPENDED = 4;
}

enum Department {
  DEPARTMENT_UNSPECIFIED = 0;
  AE = 1;
  AIML = 2;
  BT = 3;
  CD = 4;
  CH = 5;
  CSE = 6;
  CV = 7;
  CY = 8;
  ECE = 9;
  EE = 10;
  EI = 11;
  ETE = 12;
  IEM = 13;
  ISE = 14;
  MECH = 15;
}

message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string avatar_url = 4;
  UserRole role = 5;
  ProfileStatus profile_status = 6;
  string usn = 7;
  Department department = 8;
  int32 graduation_year = 9;
  string phone = 10;
}
